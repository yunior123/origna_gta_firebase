name: Strict Quality Audit

on:
  workflow_dispatch:
    inputs:
      backend_threshold:
        description: "Backend coverage threshold (%)"
        required: false
        default: "100"
      flutter_threshold:
        description: "Flutter coverage threshold (%)"
        required: false
        default: "100"
      flutter_integration_threshold:
        description: "Flutter integration coverage threshold (%)"
        required: false
        default: "100"
      e2e_specs:
        description: "Comma-separated Playwright spec paths under e2e/"
        required: false
        default: "playwright_ui/smoke-home-profile.spec.ts,playwright_ui/buyer-flow.spec.ts,playwright_ui/seller-flow.spec.ts,playwright_ui/order-lifecycle.spec.ts"
      e2e_config:
        description: "Playwright config filename under e2e/"
        required: false
        default: "playwright.config.dev.ts"
  schedule:
    - cron: "15 6 * * *"

jobs:
  strict-gate:
    name: Coverage + Real E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            functions/requirements.txt
            functions/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libcurl4-openssl-dev libgtk-3-dev libstdc++-12-dev ninja-build pkg-config xvfb
          flutter config --enable-linux-desktop

      - name: Install backend dependencies
        run: pip install -r functions/requirements.txt -r functions/requirements-dev.txt

      - name: Install Flutter dependencies
        run: cd origna_gta && flutter pub get

      - name: Install Playwright dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run random Flutter integration flows (Crash check)
        continue-on-error: true
        run: |
          cd origna_gta
          FLOWS=(integration_test/flows/*_test.dart)
          RANDOM_FLOW=$(shuf -e "${FLOWS[@]}" | head -n 1)
          echo "Running random integration flow: $RANDOM_FLOW"
          xvfb-run -a flutter test -d linux \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=STRICT_INTEGRATION=false \
            "$RANDOM_FLOW"

      - name: Run strict quality gate
        env:
          INPUT_BACKEND_THRESHOLD: ${{ github.event.inputs.backend_threshold }}
          INPUT_FLUTTER_THRESHOLD: ${{ github.event.inputs.flutter_threshold }}
          INPUT_FLUTTER_INTEGRATION_THRESHOLD: ${{ github.event.inputs.flutter_integration_threshold }}
          INPUT_E2E_SPECS: ${{ github.event.inputs.e2e_specs }}
          INPUT_E2E_CONFIG: ${{ github.event.inputs.e2e_config }}
        run: |
          BACKEND_THRESHOLD="${INPUT_BACKEND_THRESHOLD:-100}"
          FLUTTER_THRESHOLD="${INPUT_FLUTTER_THRESHOLD:-100}"
          FLUTTER_INTEGRATION_THRESHOLD="${INPUT_FLUTTER_INTEGRATION_THRESHOLD:-100}"
          E2E_SPECS="${INPUT_E2E_SPECS:-playwright_ui/smoke-home-profile.spec.ts,playwright_ui/buyer-flow.spec.ts,playwright_ui/seller-flow.spec.ts,playwright_ui/order-lifecycle.spec.ts}"
          E2E_CONFIG="${INPUT_E2E_CONFIG:-playwright.config.dev.ts}"

          BACKEND_THRESHOLD="$BACKEND_THRESHOLD" \
          FLUTTER_THRESHOLD="$FLUTTER_THRESHOLD" \
          RUN_FLUTTER_INTEGRATION_COVERAGE="true" \
          FLUTTER_INTEGRATION_THRESHOLD="$FLUTTER_INTEGRATION_THRESHOLD" \
          FLUTTER_INTEGRATION_DEVICE="linux" \
          FLUTTER_INTEGRATION_USE_XVFB="true" \
          E2E_SPECS="$E2E_SPECS" \
          E2E_CONFIG="$E2E_CONFIG" \
          E2E_PROJECT="chromium" \
          E2E_WORKERS="1" \
          E2E_FAIL_ON_FLAKY="true" \
          ./scripts/run_quality_gate.sh --e2e-random-count 2

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-quality-artifacts
          path: |
            functions/coverage.xml
            origna_gta/coverage_unit.info
            origna_gta/coverage_integration.info
            e2e/coverage-playwright/lcov.info
            e2e/playwright-report
            e2e/test-results
